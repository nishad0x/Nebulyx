<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Background -->
  <rect width="100" height="100" rx="22" fill="#030712"/>
  
  <g transform="translate(50, 48) scale(0.42)">
    <!-- Back of the orbital ring (behind 'n') -->
    <path
      d="M -75 5 C -75 -24 -20 -38 40 -26 C 68 -20 86 -8 88 6"
      stroke="#FFFFFF"
      stroke-width="12"
      stroke-linecap="round"
      fill="none"
    />
    <!-- Cyan Glowing Accent on upper-right orbit -->
    <path
      d="M 52 -22 C 72 -14 86 -4 88 8"
      stroke="#00C8FF"
      stroke-width="13"
      stroke-linecap="round"
      fill="none"
    />

    <!-- Lowercase letter 'n' -->
    <!-- Left vertical stem -->
    <path
      d="M -32 -32 V 54"
      stroke="#FFFFFF"
      stroke-width="14"
      stroke-linecap="square"
    />
    <!-- Curved arch and right vertical stem -->
    <path
      d="M -32 2 C -32 -28 -4 -34 16 -34 C 36 -34 42 -14 42 12 V 54"
      stroke="#FFFFFF"
      stroke-width="14"
      stroke-linecap="square"
      fill="none"
    />

    <!-- Front of the orbital ring (crossing in front of 'n') -->
    <path
      d="M -76 2 C -78 28 -28 42 32 30 C 62 24 82 14 88 4"
      stroke="#FFFFFF"
      stroke-width="12"
      stroke-linecap="round"
      fill="none"
    />
  </g>
</svg>
