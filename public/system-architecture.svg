<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#070b16"/>
      <stop offset="100%" stop-color="#02040a"/>
    </linearGradient>

    <!-- Cyan Glow Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <radialGradient id="radialCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00C8FF" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#00C8FF" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#00C8FF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00C8FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00C8FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00C8FF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e1526" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#070b16" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="480" rx="24" fill="url(#bgGrad)"/>
  <rect width="1200" height="480" rx="24" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Radial Ambience -->
  <circle cx="600" cy="240" r="320" fill="url(#radialCyan)"/>

  <!-- Subtle Precision Grid -->
  <g stroke="rgba(255,255,255,0.025)" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="480"/>
    <line x1="300" y1="0" x2="300" y2="480"/>
    <line x1="600" y1="0" x2="600" y2="480"/>
    <line x1="900" y1="0" x2="900" y2="480"/>
    <line x1="1100" y1="0" x2="1100" y2="480"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
  </g>

  <!-- Connecting Bus Lines -->
  <!-- Center to Left 1 -->
  <path d="M 600 240 L 260 110" stroke="#00C8FF" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="4 6"/>
  <!-- Center to Left 2 -->
  <path d="M 600 240 L 220 280" stroke="#00C8FF" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="4 6"/>
  <!-- Center to Left 3 (Bottom) -->
  <path d="M 600 240 L 320 400" stroke="#00C8FF" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="4 6"/>
  <!-- Center to Right 1 -->
  <path d="M 600 240 L 940 120" stroke="#00C8FF" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="4 6"/>
  <!-- Center to Right 2 -->
  <path d="M 600 240 L 960 290" stroke="#00C8FF" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="4 6"/>
  <!-- Center to Right 3 (Bottom) -->
  <path d="M 600 240 L 880 400" stroke="#00C8FF" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="4 6"/>

  <!-- Orbital Rings around Center -->
  <ellipse cx="600" cy="240" rx="140" ry="85" fill="none" stroke="#00C8FF" stroke-opacity="0.2" stroke-width="1.2" transform="rotate(-15 600 240)"/>
  <circle cx="600" cy="240" r="110" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Center Core: Nebulyx Kernel -->
  <g transform="translate(600, 240)">
    <circle r="68" fill="url(#cardGrad)" stroke="#00C8FF" stroke-width="1.8" filter="url(#cyanGlow)"/>
    <circle r="60" fill="#060913" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    
    <!-- Stylized n Emblem -->
    <path d="M -16 14 L -16 -12 C -16 -24, 16 -24, 16 -12 L 16 14" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
    <!-- Orbital Ring with Cyan Tip -->
    <path d="M -26 4 C -26 14, 26 14, 26 -2 C 26 -12, 10 -18, 2 -18" fill="none" stroke="#00C8FF" stroke-width="3.5" stroke-linecap="round"/>
    
    <text y="32" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11" fill="#FFFFFF" letter-spacing="1">NEBULYX CORE</text>
    <text y="44" text-anchor="middle" font-family="monospace" font-size="8.5" fill="#00C8FF" letter-spacing="1.5">v2.4 PRO</text>
  </g>

  <!-- Node 1: Web Architecture Pro (Top-Left) -->
  <g transform="translate(130, 70)">
    <rect width="250" height="78" rx="16" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <circle cx="28" cy="30" r="14" fill="#00C8FF" fill-opacity="0.1" stroke="#00C8FF" stroke-width="1"/>
    <text x="28" y="34" text-anchor="middle" font-family="monospace" font-size="11" fill="#00C8FF">01</text>
    <text x="52" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="13" fill="#FFFFFF">Web Architecture Pro</text>
    <text x="52" y="44" font-family="monospace" font-size="10.5" fill="#00C8FF">&lt;200ms Global Edge TTI</text>
    <text x="52" y="58" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" fill="#8892b0">Next.js 15 · Turbopack · React 19</text>
  </g>

  <!-- Node 2: Autonomous Workflows (Mid-Left) -->
  <g transform="translate(80, 220)">
    <rect width="260" height="78" rx="16" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <circle cx="28" cy="30" r="14" fill="#00C8FF" fill-opacity="0.1" stroke="#00C8FF" stroke-width="1"/>
    <text x="28" y="34" text-anchor="middle" font-family="monospace" font-size="11" fill="#00C8FF">02</text>
    <text x="52" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="13" fill="#FFFFFF">Autonomous Agent Core</text>
    <text x="52" y="44" font-family="monospace" font-size="10.5" fill="#34d399">42,000+ Hours Automated</text>
    <text x="52" y="58" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" fill="#8892b0">Claude 3.5 · n8n Enterprise · Self-Healing</text>
  </g>

  <!-- Node 3: Viral Signal Studio (Bottom-Left) -->
  <g transform="translate(190, 360)">
    <rect width="250" height="78" rx="16" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <circle cx="28" cy="30" r="14" fill="#00C8FF" fill-opacity="0.1" stroke="#00C8FF" stroke-width="1"/>
    <text x="28" y="34" text-anchor="middle" font-family="monospace" font-size="11" fill="#00C8FF">03</text>
    <text x="52" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="13" fill="#FFFFFF">Viral Signal Studio</text>
    <text x="52" y="44" font-family="monospace" font-size="10.5" fill="#00C8FF">18.4M+ Organic Impressions</text>
    <text x="52" y="58" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" fill="#8892b0">Algorithmic Distribution · 60fps Motion</text>
  </g>

  <!-- Node 4: AEO & GEO Search (Top-Right) -->
  <g transform="translate(820, 80)">
    <rect width="250" height="78" rx="16" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <circle cx="28" cy="30" r="14" fill="#00C8FF" fill-opacity="0.1" stroke="#00C8FF" stroke-width="1"/>
    <text x="28" y="34" text-anchor="middle" font-family="monospace" font-size="11" fill="#00C8FF">04</text>
    <text x="52" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="13" fill="#FFFFFF">AEO &amp; GEO Search</text>
    <text x="52" y="44" font-family="monospace" font-size="10.5" fill="#00C8FF">#1 Cited in LLM Search</text>
    <text x="52" y="58" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" fill="#8892b0">Perplexity · ChatGPT · JSON-LD Schema</text>
  </g>

  <!-- Node 5: Scaled Dropshipping (Mid-Right) -->
  <g transform="translate(840, 240)">
    <rect width="260" height="78" rx="16" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <circle cx="28" cy="30" r="14" fill="#00C8FF" fill-opacity="0.1" stroke="#00C8FF" stroke-width="1"/>
    <text x="28" y="34" text-anchor="middle" font-family="monospace" font-size="11" fill="#00C8FF">05</text>
    <text x="52" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="13" fill="#FFFFFF">Turnkey Commerce Core</text>
    <text x="52" y="44" font-family="monospace" font-size="10.5" fill="#f59e0b">3–5 Day Express Delivery</text>
    <text x="52" y="58" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" fill="#8892b0">Private US/EU Agents · Zero Warehouse</text>
  </g>

  <!-- Node 6: 21-Day Sprint SLA & IP Transfer (Bottom-Right) -->
  <g transform="translate(760, 370)">
    <rect width="250" height="74" rx="16" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <circle cx="28" cy="30" r="14" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-width="1"/>
    <text x="28" y="34" text-anchor="middle" font-family="monospace" font-size="11" fill="#10b981">SLA</text>
    <text x="52" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="13" fill="#FFFFFF">100% Day-1 IP Transfer</text>
    <text x="52" y="44" font-family="monospace" font-size="10.5" fill="#10b981">21-Day Production Sprint</text>
    <text x="52" y="58" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" fill="#8892b0">Zero Vendor Lock-In · Git Repo Handover</text>
  </g>

  <!-- Top Status Badge -->
  <g transform="translate(600, 36)">
    <rect x="-160" y="-14" width="320" height="28" rx="14" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <circle cx="-136" cy="0" r="3.5" fill="#00C8FF"/>
    <text x="0" y="4" text-anchor="middle" font-family="monospace" font-size="10" fill="#a0aec0" letter-spacing="1.2">SYSTEM TOPOLOGY · 280+ ANYCAST NODES</text>
  </g>
</svg>
